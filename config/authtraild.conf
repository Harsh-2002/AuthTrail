# AuthTrail configuration - sourced as root; must stay root:root 0600/0400 or authtraild refuses to load it. Never commit a real webhook URL here.

AUTH_TRAIL_ENABLED=1

# Host identity
AUTH_TRAIL_HOSTNAME=''
AUTH_TRAIL_ENVIRONMENT='production'

# Local logs
AUTH_TRAIL_LOG_DIR='/var/log/authtraild'
AUTH_TRAIL_LOG_OWNER='root'
AUTH_TRAIL_LOG_GROUP='root'
AUTH_TRAIL_LOG_MODE='0640'

# Runtime state
AUTH_TRAIL_RUN_DIR='/run/authtraild'
AUTH_TRAIL_DATA_DIR='/var/lib/authtraild'

# SSH unit to follow. Leave empty to auto-detect (ssh.service / sshd.service).
AUTH_TRAIL_SSH_UNIT=''

# Commands
AUTH_TRAIL_COMMAND_CAPTURE=1
AUTH_TRAIL_COMMAND_MAX_LEN=8192
AUTH_TRAIL_REDACT_SECRETS=1

# Mandatory access justification for real interactive SSH sessions.
AUTH_TRAIL_PURPOSE_ENABLED=1
AUTH_TRAIL_PURPOSE_REQUIRED=1
AUTH_TRAIL_PURPOSE_MIN_LENGTH=5
AUTH_TRAIL_PURPOSE_MAX_LENGTH=500
AUTH_TRAIL_PURPOSE_FULLSCREEN=1
AUTH_TRAIL_PURPOSE_CLEAR_AFTER=1
AUTH_TRAIL_PURPOSE_FAIL_MODE='closed'

# auditd (process-execution evidence layer; requires kernel audit access - not available in most containers)
AUTH_TRAIL_AUDITD_ENABLED=1

# SSH failure aggregation (audit-only, never blocks anything)
AUTH_TRAIL_FAILURE_BURST_ENABLED=1
AUTH_TRAIL_FAILURE_BURST_WINDOW=300
AUTH_TRAIL_FAILURE_BURST_THRESHOLD=5
AUTH_TRAIL_FAILURE_BURST_COOLDOWN=600

# Slack - accepts official or HTTPS enterprise relay URLs with the standard /services/... path.
AUTH_TRAIL_SLACK_ENABLED=0
AUTH_TRAIL_SLACK_WEBHOOK_URL=''
AUTH_TRAIL_SLACK_TIMEOUT=5

# actionable (default): paired purpose-confirmed interactive lifecycle, failure
# bursts, privilege transitions, and explicitly enabled sensitive-command alerts.
# verbose: also sends non-interactive starts and individual failures.
AUTH_TRAIL_SLACK_PROFILE='actionable'
AUTH_TRAIL_SLACK_QUEUE_ENABLED=1
AUTH_TRAIL_SLACK_QUEUE_MAX=1000
AUTH_TRAIL_SLACK_RETRY_MAX=8

AUTH_TRAIL_SLACK_LOGIN=1
AUTH_TRAIL_SLACK_LOGOUT=1
AUTH_TRAIL_SLACK_FAILURE=1
AUTH_TRAIL_SLACK_FAILURE_BURST=1
AUTH_TRAIL_SLACK_PRIVILEGE=1
AUTH_TRAIL_SLACK_COMMAND_ALERTS=0
AUTH_TRAIL_SLACK_INCLUDE_PURPOSE=1

# Identity registry
AUTH_TRAIL_KEY_MAP='/etc/authtraild/keys.map'

# Sensitive-command and redaction configuration
AUTH_TRAIL_SENSITIVE_COMMANDS='/etc/authtraild/sensitive-commands.conf'
AUTH_TRAIL_REDACT_FILE='/etc/authtraild/redact.conf'
